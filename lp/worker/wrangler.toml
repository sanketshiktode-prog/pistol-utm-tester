name = "pp-leads"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Retry failed CRM pushes every 15 minutes
[triggers]
crons = ["*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "pp-leads"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[vars]
# Comma-separated list of sites allowed to post leads. "*" = any.
# e.g. "https://godrejforestestatenagpur.com,https://*.github.io"
ALLOWED_ORIGINS = "*"
RATE_LIMIT_PER_10MIN = "8"
DEDUPE_HOURS = "24"
CRM_PUSH_DUPLICATES = "false"
OTP_LENGTH = "4"

# ---- CRM (set these as plain vars or, for secrets, with `wrangler secret put`) ----
# CRM_URL = "https://your-crm.example.com/api/leads"
# CRM_METHOD = "POST"
# CRM_FORMAT = "json"          # json | form | query
# CRM_FIELD_MAP = '{"name":"{{name}}","mobile":"{{phone}}","country_code":"{{country_code}}","email":"{{email}}","project":"{{project_name}}","source":"{{source}}","campaign":"{{utm_campaign}}","gclid":"{{gclid}}"}'
# CRM_SUCCESS_MATCH = "success"

# Secrets (NOT in this file):  ADMIN_TOKEN, CRM_HEADERS, CRM_STATIC, SMS_URL, SMS_HEADERS, SHEET_WEBHOOK_URL
